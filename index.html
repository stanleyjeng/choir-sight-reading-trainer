<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合唱讀譜工具</title><style>body{font-family:system-ui,"Microsoft JhengHei";background:#102036;color:#eef5ff;margin:0;padding:20px}main{max-width:1000px;margin:auto}section{background:#1b304b;padding:18px;margin:16px 0;border-radius:15px}button,select{font:inherit;padding:10px;border-radius:8px;margin:4px;background:#286b83;color:white;border:1px solid #6c9bb0}svg{width:100%;height:auto;background:#fff;border-radius:8px}h1{font-size:clamp(24px,5vw,36px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.small{color:#b8d3e4}.card{background:#203d5a;padding:12px;border-radius:12px}#msg{color:#b8f4ef}</style><main><h1>🎼 合唱讀譜工具</h1><p>15 種大調 · 高音／低音譜號 · 正式調號 · Do（1）位置 · 音階播放</p><section><label>選擇大調 <select id="key"></select></label><button id="play">▶ 播放上行／下行</button><button id="stop">■ 停止</button><p id="msg">點擊播放可聆聽音階</p><div id="detail"></div></section><section><h2>15 種大調 Do（1）位置總覽</h2><div class="grid" id="all"></div></section><p class="small">高音譜以 C4～B4 為 Do 基準音域，低音譜以 C3～B3 為基準音域；音階依音名順序上行，跨 C 時自動提高八度。聲音需在瀏覽器中點擊播放啟用。</p></main><script>
const keys=[['C',0],['G',1],['D',2],['A',3],['E',4],['B',5],['F♯',6],['C♯',7],['F',-1],['B♭',-2],['E♭',-3],['A♭',-4],['D♭',-5],['G♭',-6],['C♭',-7]];
const letters=['C','D','E','F','G','A','B'],natural={C:0,D:2,E:4,F:5,G:7,A:9,B:11},sharp=['F','C','G','D','A','E','B'],flat=['B','E','A','D','G','C','F'];let audio=null,oscillators=[],timeout=null;
const el=x=>document.getElementById(x);function pitch(n){return (natural[n[0]]+(n.includes('♯')?1:n.includes('♭')?-1:0)+12)%12}
function notes(k){let i=letters.indexOf(k[0]),root=pitch(k),steps=[0,2,4,5,7,9,11];return steps.map((s,j)=>{let l=letters[(i+j)%7],delta=(root+s-natural[l]+24)%12;return l+(delta===1?'♯':delta===11?'♭':'')})}
function yFor(letter,oct,clef){let di=letters.indexOf(letter)+7*oct,base=clef==='treble'?letters.indexOf('E')+7*4:letters.indexOf('G')+7*2;return 112-(di-base)*7}
function glyphs(svg,clef,signature,full){let add=x=>svg.insertAdjacentHTML('beforeend',x);for(let i=0;i<5;i++)add('<line x1="12" y1="'+(56+i*14)+'" x2="'+(full?605:315)+'" y2="'+(56+i*14)+'" stroke="#344256" stroke-width="1.4"/>');add(clef==='treble'?'<text x="20" y="112" font-size="73" font-family="serif" fill="#172a41">𝄞</text>':'<text x="20" y="89" font-size="57" font-family="serif" fill="#172a41">𝄢</text>');
let order=signature>0?sharp:flat;let positions=clef==='treble'?(signature>0?[56,77,49,70,91,63,84]:[84,63,91,70,98,77,105]):(signature>0?[70,91,63,84,105,77,98]:[98,77,105,84,112,91,119]);
for(let i=0;i<Math.abs(signature);i++){let x=89+i*19,y=positions[i];if(signature>0){add('<g stroke="#172a41" stroke-width="2.3"><path d="M'+(x-5)+' '+(y-15)+'v30 M'+(x+5)+' '+(y-19)+'v30 M'+(x-10)+' '+(y-4)+'l20 -4 M'+(x-10)+' '+(y+7)+'l20 -4"/></g>')}else{add('<path d="M'+(x-4)+' '+(y-22)+'v32 q17 -2 13 -12 q-4 -7 -13 2" fill="none" stroke="#172a41" stroke-width="2.8"/>')}}}
function staff(key,sig,clef,full){let svg='<svg viewBox="0 0 '+(full?620:330)+' 170" role="img" aria-label="'+key+' 大調 '+(clef==='treble'?'高音':'低音')+'譜號">';let holder=document.createElement('div');holder.innerHTML=svg+'</svg>';let node=holder.firstChild;glyphs(node,clef,sig,full);let arr=notes(key),start=letters.indexOf(key[0]);let oct=clef==='treble'?4:3;let show=full?arr:[arr[0]];show.forEach((n,i)=>{let idx=start+i,letter=letters[idx%7],o=oct+Math.floor(idx/7),y=yFor(letter,o,clef),x=(full?255+i*43:260);for(let ly=126;ly<=y;ly+=14)node.insertAdjacentHTML('beforeend','<line x1="'+(x-13)+'" y1="'+ly+'" x2="'+(x+13)+'" y2="'+ly+'" stroke="#344256"/>');for(let ly=42;ly>=y;ly-=14)node.insertAdjacentHTML('beforeend','<line x1="'+(x-13)+'" y1="'+ly+'" x2="'+(x+13)+'" y2="'+ly+'" stroke="#344256"/>');node.insertAdjacentHTML('beforeend','<ellipse cx="'+x+'" cy="'+y+'" rx="8" ry="5.5" fill="#1a6785" transform="rotate(-18 '+x+' '+y+')"/><text x="'+x+'" y="'+(y-17)+'" text-anchor="middle" font-size="13" fill="#0c435f">'+(i+1)+'</text>')});return holder.innerHTML}
function render(){let k=el('key').value,sig=keys.find(a=>a[0]===k)[1],n=notes(k);el('detail').innerHTML='<h2>'+k+' 大調</h2><p>調號：'+(sig===0?'無':Math.abs(sig)+' 個'+(sig>0?'升 ♯':'降 ♭'))+'　音階：'+n.map((v,i)=>(i+1)+'='+v).join('　')+'</p><h3>高音譜號 𝄞</h3>'+staff(k,sig,'treble',true)+'<h3>低音譜號 𝄢</h3>'+staff(k,sig,'bass',true)}
keys.forEach(([k,sig])=>{let opt=document.createElement('option');opt.value=k;opt.textContent=k+' 大調';el('key').append(opt);let card=document.createElement('div');card.className='card';card.innerHTML='<h3>'+k+' 大調 · Do = '+k+'</h3><p>高音譜號</p>'+staff(k,sig,'treble',false)+'<p>低音譜號</p>'+staff(k,sig,'bass',false);card.onclick=()=>{el('key').value=k;render();scrollTo({top:0,behavior:'smooth'})};el('all').append(card)});
el('key').onchange=render;render();
function stop(){oscillators.forEach(o=>{try{o.stop()}catch(e){}});oscillators=[];clearTimeout(timeout)}
el('stop').onclick=()=>{stop();el('msg').textContent='已停止'};
el('play').onclick=()=>{stop();try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('不支援音訊');audio??=new AC();audio.resume();let n=notes(el('key').value),root=pitch(n[0]),base=60+root;let seq=[0,2,4,5,7,9,11,12,11,9,7,5,4,2,0];let now=audio.currentTime+.08;seq.forEach((s,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=now+i*.42;o.type='triangle';o.frequency.value=440*Math.pow(2,(base+s-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.36);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.38);oscillators.push(o)});el('msg').textContent='♪ 正在播放 '+el('key').value+' 大調';timeout=setTimeout(()=>el('msg').textContent='播放完成',6700)}catch(e){el('msg').textContent='無法播放：'+e.message+'。請用 Safari 或 Chrome 開啟正式網址'}};
</script></html>
